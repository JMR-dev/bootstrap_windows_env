name: integration-test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    name: Build and run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -o dist/bootstrap_windows_env.exe ./cmd/bootstrap_windows_env
      - name: Run
        run: ./dist/bootstrap_windows_env.exe --yes --headless --no-wsl
